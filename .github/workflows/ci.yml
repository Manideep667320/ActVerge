name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  # ── Backend Tests ───────────────────────────────────────────────────────────
  backend-test:
    name: Backend · Python 3.12 · pytest
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: actverge_test
          POSTGRES_USER: actverge
          POSTGRES_PASSWORD: actverge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U actverge -d actverge_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://actverge:actverge@localhost:5432/actverge_test
      REDIS_URL: redis://localhost:6379/0
      ARQ_REDIS_URL: redis://localhost:6379/1
      ENVIRONMENT: test
      LOG_LEVEL: WARNING

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        working-directory: backend
        run: pytest tests/ -v --tb=short --color=yes

  # ── Frontend Lint & Type-check ──────────────────────────────────────────────
  frontend-lint:
    name: Frontend · Node 22 · lint + type-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type-check
        working-directory: frontend
        run: npm run type-check
