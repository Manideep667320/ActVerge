<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ActVerge Auditor</title>
  <style>
    :root {
      --bg: #09090b;
      --card-bg: #18181b;
      --border: #27272a;
      --text: #f4f4f5;
      --text-muted: #a1a1aa;
      --primary: #06b6d4;
      --primary-hover: #0891b2;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      width: 360px;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      background: linear-gradient(135deg, #06b6d4, #3b82f6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 12px;
      color: #fff;
    }
    .title {
      font-weight: 700;
      font-size: 14px;
      letter-spacing: -0.02em;
    }
    .badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 9999px;
      background: rgba(6, 182, 212, 0.15);
      color: var(--primary);
      border: 1px solid rgba(6, 182, 212, 0.3);
      font-weight: 600;
    }
    .section {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .field-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 6px;
      display: block;
    }
    .tab-info {
      font-size: 12px;
      color: var(--text);
      word-break: break-all;
      background: rgba(0, 0, 0, 0.3);
      padding: 6px 8px;
      border-radius: 4px;
      border: 1px solid var(--border);
      max-height: 48px;
      overflow-y: auto;
    }
    textarea {
      width: 100%;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 8px;
      font-size: 12px;
      resize: vertical;
      min-height: 60px;
      outline: none;
    }
    textarea:focus {
      border-color: var(--primary);
    }
    button.btn-primary {
      width: 100%;
      background: var(--primary);
      color: #000;
      font-weight: 600;
      font-size: 13px;
      border: none;
      border-radius: 6px;
      padding: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s ease;
    }
    button.btn-primary:hover {
      background: var(--primary-hover);
    }
    button.btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .result-card {
      display: none;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-top: 12px;
    }
    .result-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .verdict-tag {
      font-weight: 700;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      text-transform: uppercase;
    }
    .verdict-tag.success {
      background: rgba(16, 185, 129, 0.2);
      color: var(--success);
      border: 1px solid var(--success);
    }
    .verdict-tag.failed {
      background: rgba(239, 68, 68, 0.2);
      color: var(--danger);
      border: 1px solid var(--danger);
    }
    .verdict-tag.partial, .verdict-tag.uncertain {
      background: rgba(245, 158, 11, 0.2);
      color: var(--warning);
      border: 1px solid var(--warning);
    }
    .reasoning-text {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.4;
      margin-bottom: 10px;
      max-height: 100px;
      overflow-y: auto;
    }
    .dashboard-link {
      display: block;
      text-align: center;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--primary);
      text-decoration: none;
      padding: 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
    }
    .dashboard-link:hover {
      background: rgba(255, 255, 255, 0.1);
    }
    .status-text {
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
      margin-top: 8px;
      min-height: 14px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="logo">AV</div>
      <span class="title">ActVerge</span>
    </div>
    <span class="badge">Companion Auditor</span>
  </div>

  <div class="section">
    <label class="field-label">Active Webpage</label>
    <div id="tab-url" class="tab-info">Inspecting active tab...</div>
  </div>

  <div class="section">
    <label class="field-label" for="task-input">Verification Goal / Intended Task</label>
    <textarea id="task-input" placeholder="e.g. Verify that order #12345 has been confirmed and payment processed"></textarea>
  </div>

  <button id="verify-btn" class="btn-primary">
    <span>Audit & Verify Tab</span>
  </button>

  <div id="status-msg" class="status-text"></div>

  <div id="result-card" class="result-card">
    <div class="result-header">
      <span id="verdict-label" class="verdict-tag success">SUCCESS</span>
      <span id="confidence-label" style="font-size: 11px; color: var(--text-muted);">95% Confidence</span>
    </div>
    <p id="reasoning-text" class="reasoning-text"></p>
    <a id="view-dashboard-link" class="dashboard-link" target="_blank" href="#">
      Open Full Evidence in ActVerge Dashboard →
    </a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
