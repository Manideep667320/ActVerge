[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "actverge"
version = "0.1.0"
description = "ActVerge — Agentic AI Verification Framework"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlmodel>=0.0.21",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic-settings>=2.3.0",
    "arq>=0.26.0",
    "redis>=5.0.0",
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "litellm>=1.100.0",
    "browser-use>=0.1.0",
    "playwright>=1.46.0",
    "pgvector>=0.3.0",
    "pillow>=10.0.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "sse-starlette>=2.1.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.scripts]
actverge-api = "actverge.api.main:app"

[tool.hatch.build.targets.wheel]
packages = ["actverge"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
